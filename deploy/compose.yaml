# Honcho stack for one client droplet: Caddy (HTTPS) + Honcho + MariaDB.
# The per-client files live in ~/stack on the server, not in git:
#   .env          compose settings and database passwords (see stack.env.example)
#   staging.env   Honcho's own settings (see ../.env.example)
#   Caddyfile     web addresses (see Caddyfile.example)
# Run from ~/stack:  docker compose up -d --build
# Only Caddy publishes ports; Docker opens them around ufw.
name: honcho

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${STACK_DIR:?set in ~/stack/.env}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - honcho-staging

  honcho-staging:
    build: ..   # the repo root (paths here are relative to this file)
    image: honcho:staging
    restart: unless-stopped
    env_file: ${STACK_DIR}/staging.env
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: bpa_staging
      DB_USER: bpa_staging
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?set in ~/stack/.env}
    volumes:
      - ${DATA_DIR}/staging/files/public/uploads:/var/www/html/public/uploads
      - ${DATA_DIR}/staging/files/dmslibrary:/var/www/html/modules/dms/dmslibrary/assets
      - ${DATA_DIR}/staging/files/ccmpslibrary:/var/www/html/modules/cms/ccmpslibrary/assets
      - ${DATA_DIR}/staging/files/ccmps:/var/www/html/modules/welcome/ccmps/assets
      - ${DATA_DIR}/staging/files/users:/var/www/html/modules/honcho/users/assets
      - ${DATA_DIR}/staging/files/trongate_pages:/var/www/html/modules/trongate_pages/assets/images/uploads
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    # lower_case_table_names=1: table names ignore case, as on the Mac.
    # It only takes effect when the data folder is first created.
    command: --lower-case-table-names=1 --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in ~/stack/.env}
      MARIADB_DATABASE: bpa_staging
      MARIADB_USER: bpa_staging
      MARIADB_PASSWORD: ${STAGING_DB_PASSWORD:?set in ~/stack/.env}
      TZ: America/New_York
    volumes:
      - ${DATA_DIR}/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
